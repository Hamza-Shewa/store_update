name: store_update
description: "In-app updates for Flutter: Google Play's immediate and flexible updates with download progress, an App Store prompt on iOS, and a ready-made English and Arabic UI."
version: 0.1.1
repository: https://github.com/Hamza-Shewa/store_update
issue_tracker: https://github.com/Hamza-Shewa/store_update/issues
topics:
  - in-app-update
  - google-play
  - app-store
  - update
  - rtl

screenshots:
  - description: Offer to download a new version in the background
    path: screenshots/1_offer.png
  - description: Download progress across the top of the app
    path: screenshots/2_downloading.png
  - description: Restart to install the downloaded update
    path: screenshots/3_ready.png
  - description: A required update the user closed, with a way back to Google Play
    path: screenshots/4_required.png
  - description: The offer in Arabic, laid out right to left
    path: screenshots/5_offer_arabic.png
  - description: iOS, a newer App Store version
    path: screenshots/6_app_store.png

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^10.2.2
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: shewa.tech.store_update
        pluginClass: StoreUpdatePlugin
      ios:
        pluginClass: StoreUpdatePlugin
