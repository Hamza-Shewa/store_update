name: store_update_example
description: "Shows the store_update plugin with a real or simulated store."
publish_to: 'none'

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  store_update:
    # In an app, use: store_update: ^0.3.0
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true
